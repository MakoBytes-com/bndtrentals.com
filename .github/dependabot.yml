version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    ignore:
      # ESLint 10 is incompatible with eslint-config-next (its eslint-plugin-react
      # only supports ESLint <=9). Re-allow once eslint-config-next declares
      # support for ESLint 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is rejected outright by typescript-eslint, which fails the
      # Lint step with "typescript-eslint does not support TS 7.0" before it
      # parses a single file. Nothing in our code is the problem — the toolchain
      # simply has not caught up. Re-allow once typescript-eslint ships TS 7
      # support (tracked upstream in typescript-eslint/typescript-eslint).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: deps
      include: scope
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Mirror the npm pattern: batch minor+patch action bumps into ONE PR so they
    # auto-merge together, instead of opening a separate PR per action every
    # cycle. Majors stay individual and wait for a human, because a major action
    # bump can change runner behaviour silently.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: ci
