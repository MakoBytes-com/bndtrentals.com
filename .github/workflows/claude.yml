# Claude Duty Officer — @claude in an issue or comment dispatches Claude Code
# to implement the fix and open a PR. Installed fleet-wide from the Mako
# Studio portal's Level-2 rollout. Humans review and merge every PR.
name: Claude Duty Officer

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: claude-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # Runs on Russell's Claude Max subscription, NOT pay-per-token API
          # billing. Switched 2026-07-28 after a night of auto-dispatch put the
          # API account into its monthly cap: the portal's own triage calls are
          # genuinely cheap (~$1.07 across all of July), but each agent run here
          # is a full loop over the repo and measured $1.12 for a SINGLE run of
          # 28 turns. Thirteen fired at once and most failed.
          #
          # Token comes from `claude setup-token` (Pro/Max only) and lives as the
          # org secret CLAUDE_CODE_OAUTH_TOKEN. Note this spends Max plan usage
          # limits, which are shared with interactive Claude Code sessions — it
          # is already-paid-for, not unlimited.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Auth rides the Claude GitHub App (installed org-wide 2026-07-24),
          # so Claude's commits get proper attribution and trigger CI.
          claude_args: "--model claude-opus-4-8 --max-turns 80"
      # claude-code-action pushes a branch and stops — it has no PR creation of
      # its own, and its docs point at `gh pr create` as a separate step.
      # Without this, every finished fix sat waiting on a human to click a link,
      # which is most of "every day I am having to submit fixes manually".
      #
      # Best-effort by design: `if: always()` and a tolerant script, so a run
      # where nothing was pushed — or where a PR already exists — is a quiet
      # no-op rather than a red workflow — those cases exit 0 above.
      #
      # A REFUSED `gh pr create` is not one of those cases and must be loud.
      # This used to end in `|| echo`, so when the repo forbade Actions from
      # opening PRs the step printed one line and the run still reported
      # success. The portal saw a green run with no PR, guessed the wrong
      # cause, and handed the card back to be dispatched again — while the
      # finished fix sat on a branch nobody knew about.
      #
      # CI still covers the code either way: ci.yml runs on push, so the branch
      # commit is checked whether or not this step opens the PR.
      - name: Open a PR for the branch Claude pushed
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -u
          git fetch origin --quiet || true
          BRANCH=$(git for-each-ref --sort=-committerdate             --format='%(refname:short)'             "refs/remotes/origin/claude/issue-${ISSUE}-*"             | head -1 | sed 's|^origin/||')
          if [ -z "${BRANCH:-}" ]; then
            echo "No claude/issue-${ISSUE}-* branch was pushed; nothing to open."
            exit 0
          fi
          if [ -z "$(git rev-list "origin/${BASE_BRANCH}..origin/${BRANCH}" 2>/dev/null)" ]; then
            echo "${BRANCH} is not ahead of ${BASE_BRANCH}; nothing to open."
            exit 0
          fi
          EXISTING=$(gh pr list --head "${BRANCH}" --state all --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "${EXISTING:-}" ]; then
            echo "PR #${EXISTING} already exists for ${BRANCH}."
            exit 0
          fi
          # Body is written to a file so no multi-line string has to survive
          # YAML block-scalar indentation rules.
          {
            echo "Fixes #${ISSUE}."
            echo
            git log -1 --format=%b "origin/${BRANCH}"
            echo
            echo "---"
            echo "Opened automatically from the branch the duty officer pushed for #${ISSUE}."
            echo "The agent cannot run npm inside its sandbox, so do NOT merge without a green CI run and a human read of the diff."
          } > /tmp/claude-pr-body.md
          if gh pr create --head "${BRANCH}" --base "${BASE_BRANCH}" --title "$(git log -1 --format=%s "origin/${BRANCH}")" --body-file /tmp/claude-pr-body.md > /tmp/claude-pr.out 2>&1; then
            cat /tmp/claude-pr.out
            exit 0
          fi
          cat /tmp/claude-pr.out
          echo "::error::Could not open a pull request for ${BRANCH}. The fix IS written and pushed to that branch — it is not lost."
          if grep -qi "not permitted to create or approve pull requests" /tmp/claude-pr.out; then
            echo "::error::Cause: this repository forbids Actions from opening pull requests. Fix it at Settings -> Actions -> General -> Workflow permissions -> tick 'Allow GitHub Actions to create and approve pull requests'."
          fi
          exit 1
